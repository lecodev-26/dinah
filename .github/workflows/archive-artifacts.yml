name: dinah artifact archive

on:
  workflow_run:
    workflows: ["dinah CI", "dinah benchmarks"]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dinah-artifact-archive-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  archive:
    name: Archive artifacts only after green CI and benchmarks
    if: github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify both workflows passed for the same commit
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const [ciResponse, benchResponse] = await Promise.all([
              github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'ci.yml', branch: 'main', head_sha: sha, per_page: 100 }),
              github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'benchmarks.yml', branch: 'main', head_sha: sha, per_page: 100 }),
            ]);
            const latestForSha = (response) => response.data.workflow_runs.find((run) => run.head_sha === sha);
            const ci = latestForSha(ciResponse);
            const benchmarks = latestForSha(benchResponse);
            core.info(`commit=${sha}`);
            core.info(`CI: ${ci ? `${ci.status}/${ci.conclusion}` : 'not found'}`);
            core.info(`Benchmarks: ${benchmarks ? `${benchmarks.status}/${benchmarks.conclusion}` : 'not found'}`);
            const ready = Boolean(ci && benchmarks && ci.status === 'completed' && ci.conclusion === 'success' && benchmarks.status === 'completed' && benchmarks.conclusion === 'success');
            core.setOutput('ready', String(ready));
            if (ready) core.setOutput('benchmark_run_id', String(benchmarks.id));
            else core.info('No archive will be written: both latest runs for this exact commit must be green.');

      - name: Checkout main
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download benchmark artifacts
        if: steps.gate.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.gate.outputs.benchmark_run_id }}
          path: artifacts/benchmarks/${{ github.event.workflow_run.head_sha }}/run-${{ steps.gate.outputs.benchmark_run_id }}

      - name: Open a PR for archived artifacts (never push to main)
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          BENCHMARK_RUN_ID: ${{ steps.gate.outputs.benchmark_run_id }}
          BENCHMARK_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ steps.gate.outputs.benchmark_run_id }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          ARCHIVE_DIR="artifacts/benchmarks/${SOURCE_SHA}/run-${BENCHMARK_RUN_ID}"
          BRANCH="automation/benchmark-archive-${SOURCE_SHA}-${BENCHMARK_RUN_ID}"

          # workflow_run fires once for CI and once for benchmarks. Reuse an
          # existing branch/PR instead of trying to push duplicate commits.
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            if [ "$(gh pr list --head "${BRANCH}" --state open --json number --jq 'length')" -gt 0 ]; then
              echo "Archive PR already exists for ${BRANCH}; no duplicate PR will be created."
              exit 0
            fi
            # Downloaded artifacts are untracked on the main checkout; remove
            # that duplicate working copy before checking out the archived branch.
            git clean -fd -- "${ARCHIVE_DIR}"
            git fetch origin "${BRANCH}"
            git switch --track -c "${BRANCH}" "origin/${BRANCH}"
          else
            cat > "${ARCHIVE_DIR}/archive-manifest.txt" <<EOF_MANIFEST
          source_commit=${SOURCE_SHA}
          benchmark_workflow_run_id=${BENCHMARK_RUN_ID}
          benchmark_workflow_run_url=${BENCHMARK_RUN_URL}
          archive_trigger_workflow_run_id=${TRIGGER_RUN_ID}
          EOF_MANIFEST

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "${BRANCH}"
            git add "${ARCHIVE_DIR}"
            if git diff --cached --quiet; then
              echo "No new artifact files to archive."
              exit 0
            fi
            git commit -m "chore(artifacts): archive successful benchmark run ${SOURCE_SHA}"
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi

          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore(artifacts): archive benchmark run ${BENCHMARK_RUN_ID}" \
            --body "Automated benchmark archive for commit ${SOURCE_SHA}.\n\n- Benchmark run: ${BENCHMARK_RUN_URL}\n- CI and benchmark workflows were verified successful for the same commit.\n- This PR does not merge itself; a maintainer must review and merge it."

          # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
          # Dispatch the existing CI against the exact PR branch instead.
          gh workflow run ci.yml --ref "${BRANCH}"
