name: dinah benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benches/**'
      - 'src/runtime/**'
      - 'src/runtime.rs'
      - 'src/memory/**'
      - 'Cargo.toml'
      - '.github/workflows/benchmarks.yml'

permissions:
  contents: read

concurrency:
  group: dinah-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-benchmarks:
    name: Run Runtime benchmarks (release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run reproducible runtime benchmark harness
        run: cargo bench --bench runtime | tee runtime-benchmark-results.txt
      - name: Run reproducible memory benchmark harness
        run: cargo bench --bench memory | tee memory-benchmark-results.txt
      - name: Run reproducible compute SIMD investigation
        run: cargo bench --bench compute | tee compute-benchmark-results.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: dinah-benchmark-results-${{ github.sha }}
          path: '*-benchmark-results.txt'
          if-no-files-found: error
          retention-days: 90
