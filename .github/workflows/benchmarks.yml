name: dinah benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benches/**'
      - 'src/runtime/**'
      - 'src/runtime.rs'
      - 'src/memory/**'
      - 'src/compute.rs'
      - 'Cargo.toml'
      - 'scripts/run_benchmarks.py'
      - '.github/workflows/benchmarks.yml'
      - '.github/workflows/archive-artifacts.yml'

permissions:
  contents: read

concurrency:
  group: dinah-benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmarks:
    name: Benchmarks (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
          - label: linux-arm64
            runner: ubuntu-24.04-arm
          - label: windows-x86_64
            runner: windows-latest
          - label: macos-x86_64
            runner: macos-15-intel
          - label: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run release benchmarks and record environment
        run: python scripts/run_benchmarks.py
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: dinah-benchmark-results-${{ matrix.label }}-${{ github.sha }}
          path: benchmark-results/*.txt
          if-no-files-found: error
          retention-days: 90
