[package]
name = "dinah"
version = "0.1.0"
edition = "2021"
description = "Rust-first modular runtime and high-performance compute foundation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lecodev-26/dinah"

[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
wide = "=1.7.1"

