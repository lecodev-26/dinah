[package]
name = "dinah"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Rust-first modular runtime and high-performance compute foundation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lecodev-26/dinah"
readme = "README.md"
keywords = ["runtime", "ecs", "scheduler", "simulation", "concurrency"]
categories = ["concurrency", "data-structures", "simulation"]

# Repository-only assets that must not ship inside the published crate.
exclude = [
    ".github",
    "artifacts",
    "assets",
    "scripts",
    "puntos.md",
    "puntos2.md",
    "roadmap.md",
    "roadmap2.md",
]

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]

[dev-dependencies]
wide = "=1.7.1"

[[bench]]
name = "runtime"
path = "benches/runtime.rs"
harness = false
test = false

[[bench]]
name = "memory"
path = "benches/memory.rs"
harness = false
test = false

[[bench]]
name = "compute"
path = "benches/compute.rs"
harness = false
test = false

[[bench]]
name = "ecs"
path = "benches/ecs.rs"
harness = false
test = false

[[bench]]
name = "simulation"
path = "benches/simulation.rs"
harness = false
test = false

[[bench]]
name = "network"
path = "benches/network.rs"
harness = false
test = false

[[bench]]
name = "storage"
path = "benches/storage.rs"
harness = false
test = false
